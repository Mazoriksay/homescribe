name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      # Optional: lets the real-ffmpeg tests run instead of being skipped. A slow
      # package mirror must not hold up the run, so give up after a few minutes.
      - name: Install ffmpeg (optional)
        timeout-minutes: 5
        continue-on-error: true
        run: |
          sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 update
          sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 install -y --no-install-recommends ffmpeg
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Linux/macOS installer
        run: |
          bash -n install.sh scripts/homescribe
          shellcheck install.sh scripts/homescribe
      - name: Windows installer parses
        shell: pwsh
        run: |
          foreach ($file in 'install.ps1', 'scripts/homescribe.ps1') {
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile("$PWD/$file", [ref]$null, [ref]$errors) | Out-Null
            if ($errors) { $errors; exit 1 }
          }
      - name: Compose files are valid
        run: |
          docker compose -f compose.yaml config --quiet
          docker compose -f compose.yaml -f compose.dev.yaml config --quiet
