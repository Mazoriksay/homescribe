<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <h1 data-i18n="name"></h1>

    <section id="paired" hidden>
      <dl>
        <div>
          <dt data-i18n="server"></dt>
          <dd id="server"></dd>
        </div>
        <div>
          <dt data-i18n="lastSent"></dt>
          <dd id="last-sent"></dd>
        </div>
        <div>
          <dt data-i18n="serverStatus"></dt>
          <dd id="status"></dd>
        </div>
      </dl>
      <p id="error" class="error" hidden></p>
      <div class="actions">
        <button id="send" class="primary" type="button" data-i18n="sendNow"></button>
        <button id="unpair" type="button" data-i18n="unpair"></button>
      </div>
    </section>

    <form id="pair" hidden>
      <p class="muted" data-i18n="pairHint"></p>
      <label>
        <span data-i18n="server"></span>
        <input id="server-input" placeholder="http://192.168.1.10:8080" required />
      </label>
      <label>
        <span data-i18n="code"></span>
        <input id="code-input" placeholder="ABCD-EFGH" autocomplete="off" required />
      </label>
      <p id="pair-error" class="error" hidden></p>
      <div class="actions">
        <button class="primary" type="submit" data-i18n="connect"></button>
      </div>
    </form>

    <script src="common.js"></script>
    <script src="popup.js"></script>
  </body>
</html>
