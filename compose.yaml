# Homescribe with Docker Compose. The installer (install.sh / install.ps1)
# writes a .env next to this file; by hand:
#
#   docker compose --profile gpu up -d                     # + speech-to-text on an NVIDIA GPU
#   docker compose --profile cpu up -d                     # + speech-to-text on the CPU (slow)
#   docker compose --profile gpu --profile llm-gpu up -d   # + Ollama for summaries on the GPU
#   docker compose up -d                                   # only Homescribe; AI servers elsewhere
#
# Profiles can also be set once in .env: COMPOSE_PROFILES=gpu,llm-gpu
# To build the image from source instead: add -f compose.dev.yaml (see that file).
#
# AI addresses below are defaults for the bundled services. Any other server
# can be chosen in Settings in the UI, which overrides them.

name: homescribe

services:
  homescribe:
    image: ${HOMESCRIBE_IMAGE:-ghcr.io/mazoriksay/homescribe:latest}
    restart: unless-stopped
    ports:
      - '${HOMESCRIBE_PORT:-8080}:8080'
    # Optional: BASE_PATH, ALLOWED_NETWORKS, FRAME_ANCESTORS, LLM_MODE, ...
    env_file:
      - path: .env
        required: false
    environment:
      DATA_DIR: /data
      STT_BASE_URL: http://stt:8000
      LLM_BASE_URL: http://ollama:11434
      # Discovery in Settings looks at the bundled services and at the host.
      AI_DISCOVERY_HOSTS: stt,ollama,host.docker.internal
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    volumes:
      - homescribe-data:/data

  # speaches (faster-whisper) on an NVIDIA GPU; needs the NVIDIA Container Toolkit.
  stt-gpu:
    profiles: [gpu]
    image: ghcr.io/speaches-ai/speaches:latest-cuda
    restart: unless-stopped
    environment:
      # Downloaded on first start so the first recording does not fail.
      PRELOAD_MODELS: '["${STT_MODEL:-Systran/faster-whisper-large-v3}"]'
    volumes:
      - hf-hub-cache:/home/ubuntu/.cache/huggingface/hub
    networks:
      default:
        aliases: [stt]
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  # The same on the CPU: works anywhere, much slower for long recordings.
  stt-cpu:
    profiles: [cpu]
    image: ghcr.io/speaches-ai/speaches:latest-cpu
    restart: unless-stopped
    environment:
      PRELOAD_MODELS: '["${STT_MODEL:-Systran/faster-whisper-large-v3}"]'
    volumes:
      - hf-hub-cache:/home/ubuntu/.cache/huggingface/hub
    networks:
      default:
        aliases: [stt]

  # Optional local LLM for summaries. Pull a model once:
  #   docker compose exec ollama-gpu ollama pull llama3.1:8b   (or ollama-cpu)
  ollama-gpu:
    profiles: [llm-gpu]
    image: ollama/ollama:latest
    restart: unless-stopped
    volumes:
      - ollama-models:/root/.ollama
    networks:
      default:
        aliases: [ollama]
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  ollama-cpu:
    profiles: [llm-cpu]
    image: ollama/ollama:latest
    restart: unless-stopped
    volumes:
      - ollama-models:/root/.ollama
    networks:
      default:
        aliases: [ollama]

volumes:
  homescribe-data:
  hf-hub-cache:
  ollama-models:
